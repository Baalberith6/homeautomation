# Telegraf on lxc-scripts (192.168.1.51): the systemd state of the 0-* service units (change 020).
# File of record for /etc/telegraf/telegraf.conf on .51. The token comes from INFLUX_TOKEN in
# /etc/default/telegraf (mode 600), never from this file.
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.50:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "Home"
  bucket = "default"

[[inputs.systemd_units]]
  pattern = "0-*"
  unittype = "service"
  details = true
