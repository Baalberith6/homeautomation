# Change 020: forward all syslog to lxc-logs (192.168.1.58) over TCP.
# File of record for /etc/rsyslog.d/90-forward.conf on .50, .51 and .52.
# While .58 is down, the queue keeps up to 10000 lines and the action retries forever.
# When the queue is full, a new line is dropped at once, so local logging never blocks.
*.* action(type="omfwd" target="192.168.1.58" port="514" protocol="tcp"
           queue.type="LinkedList" queue.size="10000" queue.timeoutEnqueue="0"
           action.resumeRetryCount="-1")
