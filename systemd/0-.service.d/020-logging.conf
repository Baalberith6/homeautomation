# Change 020: applies to every 0-* unit on lxc-scripts (a drop-in for the unit name prefix "0-").
# Install as /etc/systemd/system/0-.service.d/020-logging.conf, then run systemctl daemon-reload.
# %N is the unit name without ".service", for example 0-rehau: rsyslog then files each unit in its own file.
[Service]
SyslogIdentifier=%N
Environment=PYTHONUNBUFFERED=1
